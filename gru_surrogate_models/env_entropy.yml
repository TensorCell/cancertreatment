name: cancer-nn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24,<2.0
  - pandas>=2.0
  - scikit-learn>=1.3
  - pyyaml
  - tqdm
  - pip:
      # CUDA 12.4 build of PyTorch — carries sm_80 for the A100 (Ampere)
      - --index-url=https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - --extra-index-url=https://pypi.org/simple
      - pytorch-lightning>=2.2,<2.6
      - wandb>=0.16
      - click>=8.1,<9.0
      # dev dependencies
      - pytest>=8.0
      - isort>=5.13
      - black>=24.1

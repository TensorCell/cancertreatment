[tool.poetry]
name = "cancer-nn"
version = "0.1.0"
description = "Surrogate neural network models for EMT6/Ro cancer treatment simulation"
authors = ["AWarno <anulka.warno@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.6.0"
pytorch-lightning = "^2.2"
click = "^8.1"
pandas = "^2.0"
wandb = "^0.16"
scikit-learn = "^1.3"
numpy = ">=1.24,<2.0"
pyyaml = "^6.0"
tqdm = "^4.66"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
isort = "^5.13"
black = "^24.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# 24_gru_xl with the additive log-space readout only (isolates the readout effect).
# Loss settings identical to 24_gru_xl.yml so the only difference is the model.
network:
  name: MultiHeadTaskRegressor
  config_list: ['single/gru_xl_addlog.yml']
  losses: ['L1']
  main_loss: "L1"
  margin_loss: True
  margin_loss_w: 5
  margin: -0.04
  w_losses: [1, 1]
  mode: 'gru'

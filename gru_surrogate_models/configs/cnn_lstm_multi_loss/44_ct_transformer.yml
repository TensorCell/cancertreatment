# Event-only transformer with continuous relative-time attention bias.
# Loss settings identical to 24_gru_xl.yml so the only difference is the model.
network:
  name: MultiHeadTaskRegressor
  config_list: ['single/ct_transformer.yml']
  losses: ['L1']
  main_loss: "L1"
  margin_loss: True
  margin_loss_w: 5
  margin: -0.04
  w_losses: [1, 1]
  mode: 'ct_transformer'

network:
  name: MultiHeadTaskRegressor
  config_list: ['single/lstm_2_1.yml', 'single/lstm_2_1.yml', 'single/lstm_2_1.yml']
  losses: ['HuberLoss', 'HuberLoss', 'HuberLoss']
  main_loss: "HuberLoss"
  margin_loss: True
  margin_loss_w: 5
  margin: -0.04
  w_losses: [1, 1, 1, 1]
  mode: 'cnn_lstm'
  optimizer: 'adamw'
  weight_decay: 0.0001
  scheduler: 'onecycle'

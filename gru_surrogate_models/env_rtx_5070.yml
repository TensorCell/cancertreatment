name: cancer-nn-5070
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24,<2.0
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.8
  - lightgbm>=4.0
  - pyyaml
  - tqdm
  - pip:
      # CUDA 12.8 build of PyTorch — carries sm_120 for the RTX 50-series (Blackwell).
      - --index-url=https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - --extra-index-url=https://pypi.org/simple
      - pytorch-lightning>=2.4,<2.6
      - wandb>=0.16
      - click>=8.1,<9.0
      - hyperopt>=0.2.7,<0.3.0
      # dev dependencies
      - pytest>=8.0
      - isort>=5.13
      - black>=24.1

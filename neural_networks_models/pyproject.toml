[project]
name = "nn-cancer-treatment-optimization"
version = "0.1.0"
description = "TiDE-based tumour cell survival forecasting for EMT6/Ro radiotherapy protocols"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "wandb>=0.19.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "B006"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tide"]

[tool.pytest.ini_options]
pythonpath = "."
